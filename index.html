<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио Дарьи</title>
    <!-- Подключаем файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="container">
            <div class="logo">Мой Логотип</div>
            <nav>
                <a href="#about">Обо мне</a>
                <a href="#contact">Контакты</a>
            </nav>
        </div>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="container">
            <h1>Привет, я Дарья</h1>
            <p>Создаю дизайн, который решает задачи</p>
            <a href="#contact" class="btn">Написать мне</a>
        </div>
    </section>

    <!-- Блок о себе -->
    <section id="about" class="about">
        <div class="container">
            <h2>Обо мне</h2>
            <div class="about-grid">
                <img src="my-photo.jpg" alt="Мое фото" class="about-photo">
                <div class="about-text">
                    <p>Здесь будет ваш текст о том, чем вы занимаетесь, какой у вас опыт и подход к работе.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer id="contact">
        <div class="container">
            <p>&copy; 2026 Дарья Зародина. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
