<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Static Bloom</h1>
        <div class="header-buttons">
            <a href="#" class="btn">автор</a>
            <a href="#" class="btn">о проекте</a>
        </div>
    </header>
    <!--Галерея картинок-->
    <section class="gallery-grid">
        <div class="grid-item">
            <img src="Images/one_seed_1.svg" alt="Картинка 1" class="img-top">
            <img src="Images/one_seed_2.svg" alt="Картинка 1 при наведении" class="img-bottom">
        </div>
        <div class="grid-item">
            <img src="Images/two_seed_1.svg" alt="Картинка 2" class="img-top">
            <img src="Images/two_seed_2.svg" alt="Картинка 2 при наведении" class="img-bottom">
        </div>
        <div class="grid-item">
            <img src="Images/three_seed_1.svg" alt="Картинка 3" class="img-top">
            <img src="Images/three_seed_2.svg" alt="Картинка 3 при наведении" class="img-bottom">
        </div>
    </section>
    <!--Текстовая область-->
    <main class="content">
        <h2>Кириллический шрифт</h2>
        <h3>Шрифт можно когда-нибудь скачать</h3>
        <p>Пока можно только навестись на картинки</p>
    </main>
</body>
